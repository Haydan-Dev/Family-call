<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamnasheen - Active Call</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap');

.hn-root {
  font-family: 'DM Sans', sans-serif;
  background: #0a0a0a;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #fff;
}

.phone {
  width: 100%;
  height: 100%;
  background: #111111;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

.notch {
  width: 100px; height: 22px;
  background: #111;
  border-radius: 0 0 16px 16px;
  margin: 0 auto;
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  z-index: 10;
  border: 1px solid rgba(255,199,0,0.10);
  border-top: none;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.notch-dot { width: 7px; height: 7px; border-radius: 50%; background: #1e1e1e; border: 1px solid #333; }
.notch-dot.cam { background: #222; width: 9px; height: 9px; }

.status-bar {
  height: 44px;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 24px 8px;
  flex-shrink: 0;
  z-index: 5;
}
.status-time { font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.04em; }
.status-icons { display: flex; align-items: center; gap: 5px; }
.status-gold { color: #FFC700; }

.call-bg-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,199,0,0.06);
  animation: orbitPulse 4s ease-in-out infinite;
}
@keyframes orbitPulse {
  0%, 100% { opacity: 0.4; transform: scale(0.98); }
  50% { opacity: 1; transform: scale(1.03); }
}

.call-body {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 2;
}
.call-avatar-ring {
  width: 120px; height: 120px; border-radius: 50%;
  border: 2px solid rgba(255,199,0,0.25);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
  position: relative;
}
.call-avatar-ring::before {
  content: ''; position: absolute; inset: -14px; border-radius: 50%; border: 1px solid rgba(255,199,0,0.10);
}
.call-avatar-inner {
  width: 104px; height: 104px; border-radius: 50%;
  background: #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-weight: 700; color: #FFC700;
  font-family: 'Playfair Display', serif;
}
.call-name {
  font-family: 'Playfair Display', serif;
  font-size: 28px; font-weight: 700; color: #fff;
  margin-bottom: 6px;
}
.call-sub { font-size: 12px; color: #555; letter-spacing: 0.1em; }
.call-timer { font-size: 18px; font-weight: 300; color: #FFC700; margin-top: 6px; letter-spacing: 0.1em; }

.call-quality {
  display: flex; align-items: center; gap: 6px;
  margin-top: 14px;
  background: rgba(37,211,102,0.08);
  border: 1px solid rgba(37,211,102,0.2);
  border-radius: 20px; padding: 5px 12px;
}
.call-quality-dot { width: 6px; height: 6px; border-radius: 50%; background: #25D366; animation: blink 1.5s infinite;}
.call-quality-text { font-size: 11px; color: #25D366; }

@keyframes blink { 0%,100% { opacity: 1;} 50% { opacity: 0.4;} }

.call-controls {
  width: 100%; padding: 0 28px 28px;
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 16px; z-index: 2;
}
.ctrl-btn {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer;
}
.ctrl-circle {
  width: 54px; height: 54px; border-radius: 50%;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 20px;
  transition: all 0.2s;
}
.ctrl-circle.active { background: rgba(255,199,0,0.12); border-color: rgba(255,199,0,0.3); color: #FFC700; }
.ctrl-circle.muted { background: #c0392b; color: white; border: none; }
.ctrl-circle.end-call { background: #c0392b; border-color: transparent; color: #fff; width: 62px; height: 62px; font-size: 24px; box-shadow: 0 4px 15px rgba(192,57,43,0.4); }
.ctrl-circle.end-call:active { transform: scale(0.9); }
.ctrl-label { font-size: 10px; color: #666; font-weight: 500; }
.ctrl-btn.end .ctrl-label { color: #c0392b; }

#remoteAudio { display: none; }
  </style>
</head>
<body>
  <div class="hn-root">
    <div class="phone">
      <div class="notch"><div class="notch-dot cam"></div><div class="notch-dot"></div></div>
      <div class="status-bar" style="z-index:3">
        <span class="status-time">9:45</span>
        <div class="status-icons">
          <i class="ti ti-wifi status-gold" style="font-size:13px"></i>
          <i class="ti ti-battery-2" style="font-size:13px;color:#888"></i>
        </div>
      </div>

      <div class="call-bg-ring" style="width:500px;height:500px;top:-100px;left:-90px;animation-duration: 6s;"></div>
      <div class="call-bg-ring" style="width:400px;height:400px;top:-50px;left:-40px;animation-duration: 5s;animation-delay: 1s;"></div>
      <div class="call-bg-ring" style="width:300px;height:300px;top:0px;left:10px;animation-duration: 4s;animation-delay: 2s;"></div>

      <div class="call-body" style="padding-top:20px">
        <div class="call-avatar-ring">
          <div class="call-avatar-inner" id="callAvatar">P</div>
        </div>
        <p class="call-name" id="callName">Papa</p>
        <p class="call-sub" style="letter-spacing:0.08em;color:#666">Hamnasheen • Encrypted</p>
        <p class="call-timer" id="callTimer">00:00</p>
        <div class="call-quality" id="connState">
          <div class="call-quality-dot"></div>
          <span class="call-quality-text">Crystal clear · HD Voice</span>
        </div>
      </div>

      <div class="call-controls">
        <div class="ctrl-btn" id="toggleMuteBtn">
          <div class="ctrl-circle"><i class="ti ti-microphone" id="muteIcon"></i></div>
          <span class="ctrl-label">Mute</span>
        </div>
        <div class="ctrl-btn end" id="endCallBtn">
          <div class="ctrl-circle end-call"><i class="ti ti-phone-off"></i></div>
          <span class="ctrl-label">End Call</span>
        </div>
        <div class="ctrl-btn" id="toggleSpeakerBtn">
          <div class="ctrl-circle"><i class="ti ti-volume"></i></div>
          <span class="ctrl-label">Speaker</span>
        </div>
        
        <div class="ctrl-btn">
          <div class="ctrl-circle" style="opacity:0.3;"><i class="ti ti-video-off"></i></div>
          <span class="ctrl-label">Video Off</span>
        </div>
        <div class="ctrl-btn">
          <div class="ctrl-circle"><i class="ti ti-message-2"></i></div>
          <span class="ctrl-label">Chat</span>
        </div>
        <div class="ctrl-btn">
          <div class="ctrl-circle"><i class="ti ti-dots"></i></div>
          <span class="ctrl-label">More</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Placeholder audio element for remote output -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <script src="static/js/config.js"></script>
  <script>
    // 1. UI Setup
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room_id');
    const partnerName = urlParams.get('name') || 'Family Member';
    
    document.getElementById('callName').textContent = decodeURIComponent(partnerName);
    document.getElementById('callAvatar').textContent = decodeURIComponent(partnerName).charAt(0).toUpperCase();

    let seconds = 0;
    const timerEl = document.getElementById('callTimer');
    let timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      timerEl.textContent = `${m}:${s}`;
    }, 1000);

    function setStatusText(text, color) {
      const textEl = document.querySelector('.call-quality-text');
      const dotEl = document.querySelector('.call-quality-dot');
      if (textEl) textEl.textContent = text;
      if (dotEl && color) dotEl.style.backgroundColor = color;
    }

    // Clock implementation
    setInterval(() => {
      const now = new Date();
      document.querySelector('.status-time').textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }, 10000);

    // 2. Identity logic
    const token = localStorage.getItem('token');
    let myUserId = localStorage.getItem('user_id') || 'unknown_' + Math.floor(Math.random()*10000);
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        myUserId = payload.sub || payload.id || payload.user_id || myUserId;
      } catch (e) {}
    }

    // 3. WebRTC Implementation
    let localStream;
    let peerConnection;
    let remoteIceCandidatesQueue = [];
    let pendingOffer = null;
    const remoteAudio = document.getElementById('remoteAudio');

    const servers = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    async function startMedia() {
      try {
        // STRICT CONSTRAINT FOR AUDIO ONLY
        console.log("Acquiring strictly audio stream...");
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        console.error("Failed to acquire media:", err);
        alert("Could not access microphone. Please enable permissions.");
      }

      if (localStream && pendingOffer) {
        await createPeerConnection();
        await handleOffer(pendingOffer);
        pendingOffer = null;
      }
      
      // Trigger browser audio autoplay unlock
      document.body.addEventListener('click', () => {
        if(remoteAudio.paused && remoteAudio.srcObject) {
           remoteAudio.play().catch(e => console.log("Autoplay fixed:", e));
        }
      }, {once:true});
    }

    const wsUrl = `${WS_URL}/ws/call/${roomId}/${myUserId}`;
    const ws = new WebSocket(wsUrl);

    ws.onopen = async () => {
      console.log("Call room connected via WebSocket.");
      setStatusText("Initializing WebRTC...", "#FFC700");
      const mode = urlParams.get('mode');
      
      await startMedia();
      
      if (mode === 'caller') {
        console.log("Waiting for other side to confirm ready...");
      } else {
        // Receiver notifies system they are ready for offer
        ws.send(JSON.stringify({ event: "receiver_ready", room_id: roomId }));
      }
    };

    ws.onmessage = async (event) => {
      const data = JSON.parse(event.data);
      console.log("WS Event:", data.event || "SDP/ICE");

      if (data.event === 'receiver_ready') {
         // For caller: now safe to generate offer
         initiateCall();
      } else if (data.event === 'call_ended' || data.event === 'call_declined') {
         terminateCall();
      } else if (data.offer) {
         await handleOffer(data.offer);
      } else if (data.answer) {
         await handleAnswer(data.answer);
      } else if (data.candidate || data.iceCandidate) {
         await handleRemoteIceCandidate(data.candidate || data.iceCandidate);
      }
    };

    async function createPeerConnection() {
      peerConnection = new RTCPeerConnection(servers);

      // Add track before handshake
      if (localStream) {
        localStream.getTracks().forEach(track => {
           peerConnection.addTrack(track, localStream);
        });
      }

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({ candidate: event.candidate }));
        }
      };

      peerConnection.ontrack = (event) => {
        console.log("Remote audio stream received!");
        remoteAudio.srcObject = event.streams[0];
        remoteAudio.play().catch(e => console.log("Audio auto-play block:", e));
        setStatusText("Crystal clear · HD Voice", "#25D366");
      };
    }

    async function initiateCall() {
      if (!peerConnection) await createPeerConnection();
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      ws.send(JSON.stringify({ offer: offer }));
      setStatusText("Ringing...", "#FFC700");
    }

    async function handleOffer(offer) {
      if (!localStream) {
        pendingOffer = offer;
        return;
      }
      if (!peerConnection) await createPeerConnection();
      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      await flushIceQueue();
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      ws.send(JSON.stringify({ answer: answer }));
      setStatusText("Connecting...", "#FFC700");
    }

    async function handleAnswer(answer) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
      await flushIceQueue();
    }

    async function handleRemoteIceCandidate(candidate) {
      if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      } else {
        remoteIceCandidatesQueue.push(candidate);
      }
    }

    async function flushIceQueue() {
      if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
        for (const candidate of remoteIceCandidatesQueue) {
           await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        }
        remoteIceCandidatesQueue = [];
      }
    }

    function terminateCall() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ event: "call_ended", room_id: roomId }));
        ws.close();
      }
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConnection) peerConnection.close();
      window.location.href = `chat.html?room_id=${roomId}`;
    }

    document.getElementById('endCallBtn').onclick = terminateCall;

    // Mute Feature
    let isMuted = false;
    document.getElementById('toggleMuteBtn').onclick = () => {
      if (localStream) {
        const audioTracks = localStream.getAudioTracks();
        if (audioTracks.length > 0) {
          isMuted = !isMuted;
          audioTracks[0].enabled = !isMuted;
          const circle = document.querySelector('#toggleMuteBtn .ctrl-circle');
          const icon = document.getElementById('muteIcon');
          if (isMuted) {
             circle.classList.add('muted');
             icon.className = 'ti ti-microphone-off';
          } else {
             circle.classList.remove('muted');
             icon.className = 'ti ti-microphone';
          }
        }
      }
    };

    // Prevent unintended navigation causing dangling calls
    window.onbeforeunload = terminateCall;

  </script>
</body>
</html>
