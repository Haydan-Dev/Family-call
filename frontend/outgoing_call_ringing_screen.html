<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamnasheen - Outgoing Ringing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      background: #0a0a0a;
      font-family: 'DM Sans', sans-serif;
      height: 100dvh;
      color: #fff;
      overflow: hidden;
    }

    .outgoing-stage {
      width: 100%;
      height: 100%;
      background: #0e0e0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .outgoing-stage::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 199, 0, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .app-tag {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 199, 0, 0.65);
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 4px;
    }

    .app-tag::before,
    .app-tag::after {
      content: '';
      width: 16px;
      height: 1px;
      background: rgba(255, 199, 0, 0.25);
    }

    .calling-label {
      font-size: 11px;
      color: #555;
      letter-spacing: 0.1em;
      margin-top: 3px;
    }

    .av-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      position: relative;
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255, 199, 0, 0.07);
      pointer-events: none;
    }

    .orbit-1 {
      width: 175px;
      height: 175px;
      animation: orbitPulse 3s ease-in-out infinite;
    }

    .orbit-2 {
      width: 215px;
      height: 215px;
      animation: orbitPulse 3s ease-in-out infinite 0.7s;
      border-color: rgba(255, 199, 0, 0.04);
    }

    .orbit-3 {
      width: 258px;
      height: 258px;
      animation: orbitPulse 3s ease-in-out infinite 1.4s;
      border-color: rgba(255, 199, 0, 0.025);
    }

    @keyframes orbitPulse {

      0%,
      100% {
        opacity: 0.3;
        transform: translate(-50%, -50%) scale(0.97);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.02);
      }
    }

    .av-ring {
      width: 126px;
      height: 126px;
      border-radius: 50%;
      border: 2px solid rgba(255, 199, 0, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: ringShimmer 2.4s ease-in-out infinite;
    }

    @keyframes ringShimmer {

      0%,
      100% {
        border-color: rgba(255, 199, 0, 0.18);
      }

      50% {
        border-color: rgba(255, 199, 0, 0.50);
      }
    }

    .av-ring::before {
      content: '';
      position: absolute;
      inset: -9px;
      border-radius: 50%;
      border: 1px solid rgba(255, 199, 0, 0.10);
      animation: ringShimmer 2.4s ease-in-out infinite 0.4s;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      color: #FFC700;
      overflow: hidden;
      position: relative;
      z-index: 2;
      border: 2px solid #1f1f1f;
    }

    .caller-name {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-top: 22px;
      letter-spacing: 0.01em;
    }

    .call-type-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #555;
      margin-top: 5px;
    }

    .call-type-row i {
      font-size: 13px;
      color: rgba(255, 199, 0, 0.6);
    }

    .dots {
      display: flex;
      gap: 5px;
      margin-top: 16px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 199, 0, 0.3);
      animation: dotBounce 1.3s ease-in-out infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.18s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.36s;
    }

    @keyframes dotBounce {

      0%,
      80%,
      100% {
        transform: scale(0.65);
        background: rgba(255, 199, 0, 0.22);
      }

      40% {
        transform: scale(1.15);
        background: rgba(255, 199, 0, 0.75);
      }
    }

    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .soft-row {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .soft-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .soft-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 19px;
      transition: background 0.15s, color 0.15s;
    }

    .soft-circle.on {
      background: rgba(255, 199, 0, 0.12);
      border-color: rgba(255, 199, 0, 0.28);
      color: #FFC700;
    }

    .soft-lbl {
      font-size: 10px;
      color: #444;
      font-weight: 500;
    }

    .end-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }

    .end-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #c0392b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      position: relative;
      cursor: pointer;
      transition: transform 0.12s;
      box-shadow: 0 4px 15px rgba(192, 57, 43, 0.4);
    }

    .end-btn:active {
      transform: scale(0.91);
    }

    .end-btn::before {
      content: '';
      position: absolute;
      inset: -9px;
      border-radius: 50%;
      border: 2px solid rgba(192, 57, 43, 0.30);
      animation: endPulse 2s ease-out infinite;
    }

    @keyframes endPulse {
      0% {
        opacity: 1;
        transform: scale(0.95);
      }

      100% {
        opacity: 0;
        transform: scale(1.12);
      }
    }

    .end-lbl {
      font-size: 11px;
      color: #555;
      font-weight: 500;
    }

    .swipe-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0.3;
    }

    .swipe-bar {
      width: 30px;
      height: 3px;
      border-radius: 2px;
      background: #555;
    }

    .swipe-text {
      font-size: 9px;
      color: #555;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="outgoing-stage">
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;margin-top: 20px;">
        <div class="app-tag">Hamnasheen</div>
        <span class="calling-label" id="statusLbl">Calling…</span>
      </div>

      <div class="av-zone">
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="orbit orbit-3"></div>

        <div class="av-ring">
          <div class="avatar" id="av">?</div>
        </div>

        <div class="caller-name" id="cname">Loading...</div>

        <div class="call-type-row">
          <i class="ti ti-phone-call" id="ctIcon"></i>
          <span id="ctLabel">Voice Call</span>
        </div>

        <div class="dots" id="dotsEl">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="controls">
        <div class="soft-row">
          <div class="soft-btn" id="muteBtn">
            <div class="soft-circle" id="muteC"><i class="ti ti-microphone" id="muteI"></i></div>
            <span class="soft-lbl">Mute</span>
          </div>
          <div class="soft-btn">
            <div class="soft-circle"><i class="ti ti-volume"></i></div>
            <span class="soft-lbl">Speaker</span>
          </div>
          <div class="soft-btn">
            <div class="soft-circle"><i class="ti ti-keypad"></i></div>
            <span class="soft-lbl">Keypad</span>
          </div>
          <div class="soft-btn">
            <div class="soft-circle"><i class="ti ti-user-plus"></i></div>
            <span class="soft-lbl">Add</span>
          </div>
        </div>

        <div class="end-wrap">
          <div class="end-btn" id="cancelBtn">
            <i class="ti ti-phone-x"></i>
          </div>
          <span class="end-lbl" id="endLbl">Cancel</span>
        </div>

        <div class="swipe-hint" style="margin-bottom:15px">
          <div class="swipe-bar"></div>
          <span class="swipe-text">swipe up for options</span>
        </div>
      </div>
  </div>

  <script src="static/js/config.js"></script>
  <script>
    // 1. Parse URL State
    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('room_id');
    const recipientName = params.get('name') || 'Family Member';

    document.getElementById('cname').textContent = decodeURIComponent(recipientName);
    document.getElementById('av').textContent = decodeURIComponent(recipientName).charAt(0).toUpperCase();

    // 2. Clock update
    function tick() {
      const n = new Date();
      const el = document.getElementById('clk');
      if (el) el.textContent = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
    }
    tick(); setInterval(tick, 10000);

    // 3. Identity
    const token = localStorage.getItem('token');
    let myUserId = localStorage.getItem('user_id') || 'unknown';
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        myUserId = payload.sub || payload.id || payload.user_id || myUserId;
      } catch (e) { }
    }

    // 4. WebSocket Event listener for call acceptance
    const wsUrl = `${WS_URL}/ws/call/${roomId}/${myUserId}`;
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      console.log("Outgoing signaling websocket linked.");
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      console.log("WebSocket Rx:", data.event);

      if (data.event === 'call_accepted') {
        // Redirect caller to real active call screen
        const lbl = document.getElementById('statusLbl');
        lbl.textContent = 'Connected';
        lbl.style.color = '#25D366';
        setTimeout(() => {
          window.location.href = `audio_activecall.html?room_id=${roomId}&mode=caller&call_type=audio&name=${encodeURIComponent(recipientName)}`;
        }, 500);
      }
      else if (data.event === 'call_declined') {
        const lbl = document.getElementById('statusLbl');
        lbl.textContent = 'Call Declined';
        lbl.style.color = '#c0392b';
        document.getElementById('dotsEl').style.opacity = '0';
        setTimeout(() => {
          window.location.href = `chat.html?room_id=${roomId}`;
        }, 2000);
      }
    };

    // 5. Interactivity
    let muted = false;
    document.getElementById('muteBtn').onclick = () => {
      muted = !muted;
      const c = document.getElementById('muteC');
      const i = document.getElementById('muteI');
      c.classList.toggle('on', muted);
      i.className = muted ? 'ti ti-microphone-off' : 'ti ti-microphone';
    };

    document.getElementById('cancelBtn').onclick = () => {
      const lbl = document.getElementById('statusLbl');
      lbl.textContent = 'Cancelling...';
      lbl.style.color = '#c0392b';

      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ event: "call_cancelled", room_id: roomId }));
      }

      setTimeout(() => {
        window.location.href = `chat.html?room_id=${roomId}`;
      }, 500);
    };
  </script>
</body>

</html>
