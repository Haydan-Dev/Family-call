<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Hamnasheen - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="static/css/style.css">
<script src="static/js/auth_guard.js"></script>
</head>
<body>

<div class="splash">

  <div class="center">
    <div class="logo-wrap">
      <div class="logo">
        <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M36 6 L6 28 H14 V64 H58 V28 H66 Z" stroke="#FFC700" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
        <circle cx="27" cy="34" r="3.5" fill="#FFC700"/>
        <path d="M27 38 Q27 46 27 52" stroke="#FFC700" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M27 42 Q23 45 21 48" stroke="#FFC700" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M27 42 Q31 44 34 46" stroke="#FFC700" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M27 52 Q25 57 24 62" stroke="#FFC700" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M27 52 Q29 57 30 62" stroke="#FFC700" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="40" cy="38.5" r="2.6" fill="#FFC700"/>
        <path d="M40 41.5 Q40 47 40 53" stroke="#FFC700" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M40 44.5 Q37 45.5 34 46" stroke="#FFC700" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M40 44.5 Q44 42 46 40" stroke="#FFC700" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M40 53 Q38.5 57 38 62" stroke="#FFC700" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M40 53 Q41.5 57 42 62" stroke="#FFC700" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <circle cx="34" cy="46" r="1.8" fill="#FFC700" opacity="0.9"/>
      </svg>
      </div>
    </div>
    <h1 class="name">Ham<em>nasheen</em></h1>
    <p class="tagline">Login</p>
    <div class="line"></div>
  </div>

  <form class="form-container" id="loginForm">
    <input type="email" id="email" class="input-field" placeholder="Email" required />
    <div style="position: relative; width: 100%;">
      <input type="password" id="password" class="input-field" placeholder="Password" required style="padding-right: 48px;" />
      <span style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #A0A0A0; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;" onclick="const pwd = document.getElementById('password'); const isPwd = pwd.type === 'password'; pwd.type = isPwd ? 'text' : 'password'; this.innerHTML = isPwd ? '<svg width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\'></path><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'></line></svg>' : '<svg width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'></path><circle cx=\'12\' cy=\'12\' r=\'3\'></circle></svg>';">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </span>
    </div>
    <div style="text-align: right; margin-top: -4px; margin-bottom: 4px; padding-right: 4px;">
      <a href="forgot-password.html" style="color: #FFC700; font-size: 13px; text-decoration: none; font-weight: 500; font-family: 'DM Sans', sans-serif;">Forgot Password?</a>
    </div>
    <button type="submit" class="btn-primary">Login</button>
    <a href="signup.html" class="btn-secondary">Don't have an account? Sign Up</a>
  </form>

  <form class="form-container hidden" id="twoFaForm">
    <p style="color: #A0A0A0; font-size: 14px; text-align: center; margin-bottom: 20px;">We've sent a 6-digit code to your email. Please enter it below to verify your identity.</p>
    <input type="text" id="twoFaCode" class="input-field" placeholder="Enter 6-digit code" maxlength="6" required style="text-align: center; font-size: 20px; letter-spacing: 4px;" />
    <button type="submit" class="btn-primary">Verify Code</button>
    <a href="#" id="backToLogin" class="btn-secondary" style="margin-top: 10px;">Back to Login</a>
  </form>

</div>

<script src="static/js/config.js"></script>
<script src="static/js/auth.js" defer></script>

</body>
</html>
