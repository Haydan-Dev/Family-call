<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamnasheen - Incoming Call</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap');

.hn-root {
  font-family: 'DM Sans', sans-serif;
  background: #0a0a0a;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #fff;
}

.phone {
  width: 100%;
  height: 100%;
  background: #111111;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

.notch {
  width: 100px; height: 22px;
  background: #111;
  border-radius: 0 0 16px 16px;
  margin: 0 auto;
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  z-index: 10;
  border: 1px solid rgba(255,199,0,0.10);
  border-top: none;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.notch-dot { width: 7px; height: 7px; border-radius: 50%; background: #1e1e1e; border: 1px solid #333; }
.notch-dot.cam { background: #222; width: 9px; height: 9px; }

.status-bar {
  height: 44px;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 24px 8px;
  flex-shrink: 0;
  z-index: 5;
}
.status-time { font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.04em; }
.status-icons { display: flex; align-items: center; gap: 5px; }
.status-gold { color: #FFC700; }

.call-bg-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,199,0,0.06);
  animation: pulseRing 3s infinite ease-in-out;
}

@keyframes pulseRing {
  0% { transform: scale(0.98); opacity: 0.4; }
  50% { transform: scale(1.03); opacity: 1; }
  100% { transform: scale(0.98); opacity: 0.4; }
}

.call-avatar-ring {
  border-radius: 50%;
  border: 2px solid rgba(255,199,0,0.25);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.call-avatar-inner {
  border-radius: 50%;
  background: #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #FFC700;
  font-family: 'Playfair Display', serif;
}

.call-action-btn {
  cursor: pointer;
  transition: transform 0.1s;
  user-select: none;
}
.call-action-btn:active {
  transform: scale(0.9);
}
  </style>
</head>
<body>
  <div class="hn-root">
    <div class="phone">
      <div class="notch"><div class="notch-dot cam"></div><div class="notch-dot"></div></div>
      <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="status-icons">
          <i class="ti ti-wifi status-gold" style="font-size:13px"></i>
          <i class="ti ti-battery-2" style="font-size:13px;color:#888"></i>
        </div>
      </div>

      <!-- Decorative Background Rings -->
      <div class="call-bg-ring" style="width:500px;height:500px;top:-100px;left:-90px"></div>
      <div class="call-bg-ring" style="width:380px;height:380px;top:-40px;left:-30px;animation-delay: 1s;"></div>

      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:2;padding-top:10px">
        <p style="font-size:11px;color:#555;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px">Hamnasheen • Incoming Call</p>
        
        <div class="call-avatar-ring" style="width:120px;height:120px">
          <div class="call-avatar-inner" id="callerAvatar" style="width:104px;height:104px;font-size:40px">?</div>
        </div>
        
        <p id="callerName" style="font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#fff;margin-top:12px">Loading...</p>
        <p style="font-size:12px;color:#555">Voice Call</p>

        <div style="width:100%;display:flex;justify-content:space-around;align-items:center;padding:24px 40px 0">
          <!-- Decline Action -->
          <div class="call-action-btn" id="declineBtn" style="display:flex;flex-direction:column;align-items:center;gap:10px">
            <div style="width:60px;height:60px;border-radius:50%;background:#c0392b;display:flex;align-items:center;justify-content:center;box-shadow: 0 4px 15px rgba(192,57,43,0.3)">
              <i class="ti ti-phone-off" style="font-size:24px;color:#fff"></i>
            </div>
            <span style="font-size:11px;color:#888">Decline</span>
          </div>
          
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
            <div style="background:rgba(255,199,0,0.08);border:1px solid rgba(255,199,0,0.2);border-radius:20px;padding:6px 16px;margin-bottom:4px;cursor:pointer">
              <span style="font-size:10px;color:#FFC700;letter-spacing:0.08em">REMIND ME</span>
            </div>
            <div style="background:rgba(255,199,0,0.08);border:1px solid rgba(255,199,0,0.2);border-radius:20px;padding:6px 16px;cursor:pointer">
              <span style="font-size:10px;color:#FFC700;letter-spacing:0.08em">MESSAGE</span>
            </div>
          </div>
          
          <!-- Accept Action -->
          <div class="call-action-btn" id="acceptBtn" style="display:flex;flex-direction:column;align-items:center;gap:10px">
            <div style="width:60px;height:60px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow: 0 4px 15px rgba(37,211,102,0.3)">
              <i class="ti ti-phone" style="font-size:24px;color:#fff"></i>
            </div>
            <span style="font-size:11px;color:#888">Accept</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Standard System Setup & Audio Logic -->
  <script src="static/js/config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('room_id');
    const callerName = params.get('caller_name') || 'Family Member';
    const callId = params.get('call_id');
    
    document.getElementById('callerName').textContent = decodeURIComponent(callerName);
    document.getElementById('callerAvatar').textContent = decodeURIComponent(callerName).charAt(0).toUpperCase();

    const token = localStorage.getItem('token');
    let myUserId = localStorage.getItem('user_id') || 'unknown';
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        myUserId = payload.sub || payload.id || payload.user_id || myUserId;
      } catch (e) {}
    }

    function tick() {
      const now = new Date();
      document.querySelector('.status-time').textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }
    setInterval(tick, 10000);
    tick();

    const incomingAudio = new Audio('./sounds/ringtone.mp3');
    incomingAudio.loop = true;
    try { incomingAudio.play(); } catch(e) { console.log("Blocked:", e); }

    function stopRinging() {
      incomingAudio.pause();
      incomingAudio.currentTime = 0;
    }

    const wsUrl = `${WS_URL}/ws/call/${roomId}/${myUserId}`;
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      console.log("Listening for incoming signaling...");
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.event === 'call_cancelled') {
        stopRinging();
        window.location.href = `chat.html?room_id=${roomId}`;
      }
    };

    document.getElementById('acceptBtn').onclick = () => {
      stopRinging();
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ event: 'call_accepted', room_id: roomId }));
      }
      setTimeout(() => {
         const callIdParam = callId ? `&call_id=${callId}` : '';
         window.location.href = `audio_activecall.html?room_id=${roomId}&mode=receiver&call_type=audio&name=${encodeURIComponent(callerName)}${callIdParam}`;
      }, 100);
    };

    document.getElementById('declineBtn').onclick = async () => {
      stopRinging();
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ event: 'call_declined', room_id: roomId }));
      }
      if (callId) {
        try {
          await fetch(`${BASE_URL}/calls/status_update/${callId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ call_status: 'rejected' })
          });
        } catch(e) { console.error("Error updating call status", e); }
      }
      setTimeout(() => {
         window.location.href = `chat.html?room_id=${roomId}`;
      }, 100);
    };
  </script>
</body>
</html>
