<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hamnasheen - Recent Calls</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="static/css/style.css">
  <style>
    body { background-color: #000; margin: 0; font-family: 'DM Sans', sans-serif; }
    
    .chat-header {
      padding: 16px; 
      background: #111111; 
      border-bottom: 1px solid rgba(255, 199, 0, 0.1); 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      z-index: 10;
      position: sticky;
      top: 0;
    }

    .tabs {
      display: flex;
      padding: 10px 16px;
      background: #0a0a0a;
      gap: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      overflow-x: auto;
      white-space: nowrap;
      -ms-overflow-style: none; /* IE and Edge */
      scrollbar-width: none;    /* Firefox */
    }
    
    .tabs::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }
    
    .tab {
      color: #888;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding-bottom: 8px;
      position: relative;
      transition: color 0.3s;
    }
    
    .tab.active {
      color: #FFC700;
      font-weight: 600;
    }
    
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #FFC700;
      border-radius: 2px;
    }

    .call-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .call-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .call-item:active {
      background: rgba(255, 255, 255, 0.03);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 199, 0, 0.1);
      border: 1px solid rgba(255, 199, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #FFC700;
      flex-shrink: 0;
    }

    .call-info {
      flex: 1;
      margin-left: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .contact-name {
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      margin: 0;
      line-height: 1.2;
    }

    .call-time {
      color: #888;
      font-size: 13px;
      margin: 4px 0 0 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .call-time i {
      font-size: 14px;
    }

    .call-action {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFC700;
      font-size: 22px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      color: #888;
      height: 50vh;
    }
    
    .empty-state i {
      font-size: 48px;
      color: rgba(255, 199, 0, 0.2);
      margin-bottom: 16px;
    }

    .empty-state p {
      font-size: 15px;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="hn-root">
  <div class="phone" style="background: #0a0a0a; display: flex; flex-direction: column;">
    
    <!-- Header -->
    <header class="chat-header">
      <button class="back-btn" onclick="window.location.href='home.html'" style="background: none; border: none; color: #FFC700; font-size: 22px; cursor: pointer; display: flex; align-items: center; padding: 0;">
        <i class="ti ti-arrow-left"></i>
      </button>
      <div style="flex: 1; text-align: left;">
        <h1 style="margin: 0; font-size: 18px; color: #fff; font-family: 'Playfair Display', serif; font-weight: 700;">Recent Calls</h1>
      </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" id="tabAll">All</div>
      <div class="tab" id="tabIncoming">Incoming</div>
      <div class="tab" id="tabOutgoing">Outgoing</div>
      <div class="tab" id="tabMissed">Missed</div>
      <div class="tab" id="tabRejected">Rejected</div>
    </div>

    <!-- Call List Container -->
    <main class="call-list" id="callList">
      <div style="text-align: center; padding: 40px;">
        <div class="spinner" style="margin: 0 auto; border-color: rgba(255,199,0,0.3); border-top-color: #FFC700;"></div>
      </div>
    </main>

    <!-- Bottom Navigation Footer -->
    <div class="bottom-nav">
      <div class="nav-item" onclick="window.location.href='home.html'" style="cursor: pointer;">
        <i class="ti ti-message-2"></i>
        <span>Chats</span>
      </div>
      <div class="nav-item active">
        <i class="ti ti-phone"></i>
        <span>Calls</span>
      </div>
      <div class="nav-item" style="flex:1.2">
        <div class="nav-cam-btn"><i class="ti ti-camera"></i></div>
      </div>
      <div class="nav-item">
        <i class="ti ti-users"></i>
        <span>Family</span>
      </div>
      <div class="nav-item">
        <i class="ti ti-settings"></i>
        <span>Settings</span>
      </div>
    </div>

  </div>
</div>

<script src="static/js/auth_guard.js"></script>
<script src="static/js/config.js"></script>
<script>
  // State Management
  let allCalls = [];
  let currentFilter = 'all';
  let myUserId = 'unknown';

  // Extract User ID from JWT
  async function getUserIdFromToken() {
    const token = await window.NativeStorage.getItem('token');
    if (!token) return 'unknown';
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      return payload.sub || payload.id || payload.user_id || 'unknown';
    } catch (e) {
      return 'unknown';
    }
  }

  // Format Date gracefully
  function formatCallTime(dateString) {
    if (!dateString) return 'Unknown time';
    const date = new Date(dateString);
    const now = new Date();
    
    const isToday = date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    
    if (isToday) return `Today, ${timeStr}`;
    
    const isYesterday = new Date(now.setDate(now.getDate() - 1)).getDate() === date.getDate();
    if (isYesterday) return `Yesterday, ${timeStr}`;
    
    return `${date.toLocaleDateString()} ${timeStr}`;
  }

  // Render Logic
  function renderCalls(filter) {
    const listEl = document.getElementById('callList');
    listEl.innerHTML = '';

    // Filter Logic
    let displayCalls = allCalls;
    if (filter === 'missed') {
      displayCalls = allCalls.filter(call => {
        const isReceiver = call.receiver_id === myUserId;
        return call.call_status === 'missed' && isReceiver;
      });
    } else if (filter === 'incoming') {
      displayCalls = allCalls.filter(call => {
        const isReceiver = call.receiver_id === myUserId;
        return isReceiver && (call.call_status === 'ended' || call.call_status === 'ongoing');
      });
    } else if (filter === 'outgoing') {
      displayCalls = allCalls.filter(call => {
        const isCaller = call.caller_id === myUserId;
        return isCaller;
      });
    } else if (filter === 'rejected') {
      displayCalls = allCalls.filter(call => call.call_status === 'rejected');
    }

    if (displayCalls.length === 0) {
      const placeholderMap = {
        'all': 'No recent calls',
        'missed': 'No missed calls',
        'incoming': 'No incoming calls',
        'outgoing': 'No outgoing calls',
        'rejected': 'No rejected calls'
      };
      
      listEl.innerHTML = `
        <div class="empty-state">
          <i class="ti ti-phone-off"></i>
          <p>${placeholderMap[filter]}</p>
        </div>
      `;
      return;
    }

    // Sort newest first
    displayCalls.sort((a, b) => new Date(b.started_at) - new Date(a.started_at));

    displayCalls.forEach(call => {
      const isCaller = call.caller_id === myUserId;
      // If we are caller, the contact is the receiver. If we are receiver, contact is caller.
      const contactId = isCaller ? call.receiver_id : call.caller_id;
      // In a real app, you'd map this contactId to a real name from your DB.
      // For now, we fallback to a beautiful short string.
      const contactName = `User ${contactId.toString().substring(0,4).toUpperCase()}`; 
      const avatarInitial = contactName.charAt(5) || 'U';

      // Determine Icons and Colors
      let arrowIcon = '';
      let arrowColor = '';
      
      if (call.call_status === 'missed') {
        arrowIcon = 'ti-arrow-down-left';
        arrowColor = '#c0392b'; // Red
      } else if (call.call_status === 'rejected') {
        arrowIcon = isCaller ? 'ti-arrow-up-right' : 'ti-arrow-down-left';
        arrowColor = '#c0392b'; // Red
      } else if (call.call_status === 'ended' || call.call_status === 'ongoing') {
        if (isCaller) {
          arrowIcon = 'ti-arrow-up-right';
          arrowColor = '#4facfe'; // Blue for outgoing answered
        } else {
          arrowIcon = 'ti-arrow-down-left';
          arrowColor = '#25D366'; // Green for incoming answered
        }
      } else {
        // Ringing / Unknown
        arrowIcon = isCaller ? 'ti-arrow-up-right' : 'ti-arrow-down-left';
        arrowColor = '#888'; 
      }

      const mediaIcon = call.call_type === 'video' ? 'ti-video' : 'ti-phone';

      // Build HTML
      const item = document.createElement('div');
      item.className = 'call-item';
      item.innerHTML = `
        <div class="avatar">${avatarInitial}</div>
        <div class="call-info">
          <p class="contact-name" style="${(call.call_status === 'missed' && !isCaller) ? 'color: #c0392b;' : ''}">${contactName}</p>
          <p class="call-time">
            <i class="ti ${arrowIcon}" style="color: ${arrowColor};"></i> 
            ${formatCallTime(call.started_at)}
          </p>
        </div>
        <div class="call-action">
          <i class="ti ${mediaIcon}"></i>
        </div>
      `;
      listEl.appendChild(item);
    });
  }

  // Fetch Logic
  async function fetchCallHistory(userId) {
    const token = await window.NativeStorage.getItem('token');
    
    try {
      // Hit actual endpoint defined in callroutes.py
      const res = await fetch(`${BASE_URL}/calls/history`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (res.ok) {
        const data = await res.json();
        allCalls = data.data || [];
      } else {
        // Mock fallback if endpoint not fully ready
        throw new Error("Endpoint returned non-200");
      }
    } catch (e) {
      console.warn("Falling back to mock data", e);
      allCalls = [
        {
          _id: "m1",
          caller_id: "other_user",
          receiver_id: userId,
          call_type: "video",
          call_status: "missed",
          started_at: new Date(Date.now() - 1000 * 60 * 30).toISOString() // 30 mins ago
        },
        {
          _id: "m2",
          caller_id: userId,
          receiver_id: "contact_123",
          call_type: "audio",
          call_status: "ended",
          started_at: new Date(Date.now() - 1000 * 60 * 60 * 2).toISOString(),
          duration: 124
        },
        {
          _id: "m3",
          caller_id: "contact_456",
          receiver_id: userId,
          call_type: "audio",
          call_status: "ended",
          started_at: new Date(Date.now() - 1000 * 60 * 60 * 24).toISOString(),
          duration: 500
        }
      ];
    }

    renderCalls('all');
  }

  // Tab Listeners Setup
  function switchTab(clickedId, filterValue) {
    const tabs = ['tabAll', 'tabIncoming', 'tabOutgoing', 'tabMissed', 'tabRejected'];
    tabs.forEach(id => {
      document.getElementById(id).classList.remove('active');
    });
    document.getElementById(clickedId).classList.add('active');
    currentFilter = filterValue;
    renderCalls(currentFilter);
  }

  document.getElementById('tabAll').addEventListener('click', () => switchTab('tabAll', 'all'));
  document.getElementById('tabIncoming').addEventListener('click', () => switchTab('tabIncoming', 'incoming'));
  document.getElementById('tabOutgoing').addEventListener('click', () => switchTab('tabOutgoing', 'outgoing'));
  document.getElementById('tabMissed').addEventListener('click', () => switchTab('tabMissed', 'missed'));
  document.getElementById('tabRejected').addEventListener('click', () => switchTab('tabRejected', 'rejected'));

  // Initialization
  window.addEventListener('DOMContentLoaded', async () => {
    myUserId = await getUserIdFromToken();
    fetchCallHistory(myUserId);
  });
</script>
</body>
</html>
